# commit-msg runs commitlint (conventional commits); {1} is the message file path
commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    check:
      run: bun run check --fix --no-errors-on-unmatched
      stage_fixed: true
    typecheck:
      run: bun run typecheck
